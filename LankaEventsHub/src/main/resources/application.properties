# ===================================================================
# Verdant Events - application.properties
#
# WORKFLOW: the database is set up manually, separately from the app -
# see database/01_schema.sql and database/02_seed_data.sql at the
# project root. Run those two files against MySQL yourself first
# (create the database, run 01_schema.sql, then 02_seed_data.sql),
# THEN start this app. The app only connects - it does not create or
# reset the database on its own.
#
# CREDENTIALS: nothing sensitive is hard-coded here. Every value below
# reads an environment variable and falls back to a local development
# default, so a real deployment overrides them without editing this
# file and without a password ever reaching version control:
#
#   export DB_URL=jdbc:mysql://db.internal:3306/eventsphere
#   export DB_USERNAME=eventsphere
#   export DB_PASSWORD='...'
#   export APP_PASSWORD_RESET_DEV_MODE=false
# ===================================================================

spring.application.name=EventSphere

# --- Database connection ---
# Must point at a database that ALREADY EXISTS (created by running
# database/01_schema.sql yourself) - createDatabaseIfNotExist is left off
# on purpose, since the schema file is the single source of truth for the
# database structure, not this application.
spring.datasource.url=jdbc:mysql://localhost:3306/eventsphere?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=200305400714
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# ddl-auto is "none" because the SQL files are the single source of truth
# for the database structure - Hibernate never creates, alters, or drops
# tables on its own. This keeps the SQL schema and the Java entities
# intentionally in sync.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Off deliberately. With open-in-view on (the Spring Boot default) a
# Hibernate session stays open for the whole request, so a template can
# silently trigger extra database queries - and a missing fetch only shows
# up in production. Every page here is rendered from DTOs built inside the
# service transaction, so nothing needs it.
spring.jpa.open-in-view=false

# SQL logging is useful while developing and noisy (and a little leaky)
# otherwise, so it is off unless SHOW_SQL=true is set.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Database initialization: OFF ---
# Spring Boot's own schema.sql/data.sql auto-run mechanism is unused - the
# real files live in database/ at the project root (not on the classpath)
# and are run manually against MySQL. This stops the app silently
# re-seeding or wiping data on every restart.
spring.sql.init.mode=never

# --- Password reset ---
# Reset links are NOT emailed, even when the mail channel below is
# configured. Notifications and password resets are different risks: a
# notification reaching the wrong inbox is embarrassing, a reset link
# reaching one is an account takeover, and wiring the two together on
# the strength of an untested SMTP configuration is not a trade worth
# making. The token is created and an administrator hands it over.
#
# The default is FALSE, deliberately: the safe behaviour has to be the one
# you get by forgetting to set anything. With it off the token is created
# but never displayed or logged, so a deployment that ships this file
# unchanged does not hand out reset links. A developer who wants to walk
# the flow locally opts in explicitly:
#     export APP_PASSWORD_RESET_DEV_MODE=true
# See PasswordResetService.
app.password-reset.dev-mode=${APP_PASSWORD_RESET_DEV_MODE:false}

# --- Error handling ---
# Never send exception details or stack traces to a client; the
# GlobalExceptionHandler returns a safe message and logs the detail
# server-side instead.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# --- Server ---
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------
# Event lifecycle scheduling (EventLifecycleScheduler)
#
# Reminders go to confirmed attendees of events starting within the lead
# time; the sweep is idempotent, so the interval only controls latency.
# The completion job closes PUBLISHED events whose end time has passed,
# which is what makes "a completed event cannot be registered for" true
# without an organizer having to remember to press a button.
# ---------------------------------------------------------------------
# Lead times in hours, comma separated, in any order. 168 is seven days
# ahead (while there is still time to arrange to go) and 24 is the day
# before (so it is not forgotten). Each owns a band that ends where the
# next smaller one begins, so an attendee gets each reminder once and
# is never told "starts in 7 days" about something happening tomorrow.
app.reminders.lead-times-hours=${APP_REMINDER_LEAD_HOURS:168,24}
app.reminders.interval-ms=${APP_REMINDER_INTERVAL_MS:1800000}
app.reminders.initial-delay-ms=${APP_REMINDER_INITIAL_DELAY_MS:60000}
app.lifecycle.interval-ms=${APP_LIFECYCLE_INTERVAL_MS:900000}
app.lifecycle.initial-delay-ms=${APP_LIFECYCLE_INITIAL_DELAY_MS:30000}

# ---------------------------------------------------------------------
# Booking holds (RegistrationServiceImpl, EventLifecycleScheduler)
#
# On a PAID event, registering reserves the seat rather than confirming
# the booking: the seat is yours immediately, the booking is confirmed
# when the payment clears. The hold is how long you have to pay - long
# enough to find a card, short enough that an abandoned checkout does not
# keep a seat off the market for the rest of the day.
#
# The sweep runs more often than the hold is long, so a released seat
# reaches the waitlist quickly. A free event has nothing to pay and never
# uses a hold at all.
# ---------------------------------------------------------------------
app.bookings.payment-hold-minutes=${APP_PAYMENT_HOLD_MINUTES:30}
app.bookings.hold-sweep-interval-ms=${APP_HOLD_SWEEP_INTERVAL_MS:300000}
app.bookings.hold-sweep-initial-delay-ms=${APP_HOLD_SWEEP_INITIAL_DELAY_MS:45000}

# ---------------------------------------------------------------------
# Email notifications (notification/ package)
#
# OFF unless app.mail.host is set. That default is the important one: an
# installation that ships this file unchanged behaves exactly as the
# system did before email existed - in-app notifications only - instead
# of failing against a mail server nobody configured.
#
# NO CREDENTIAL IS STORED HERE. Every value reads an environment
# variable, the same way the database password does:
#
#   export MAIL_HOST=smtp.example.com
#   export MAIL_PORT=587
#   export MAIL_USERNAME=no-reply@example.com
#   export MAIL_PASSWORD='...'
#
# MAIL_FROM defaults to MAIL_USERNAME, which is what most relays expect.
# Mail is sent on a background thread and a failure is logged, never
# raised - a mail server being down must not stop somebody registering.
# ---------------------------------------------------------------------
app.mail.host=${MAIL_HOST:}
app.mail.port=${MAIL_PORT:587}
app.mail.username=${MAIL_USERNAME:}
app.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Verdant Events}
app.mail.start-tls=${MAIL_START_TLS:true}
app.mail.timeout-ms=${MAIL_TIMEOUT_MS:10000}

# ---------------------------------------------------------------------
# Refund policy
#
# NOT CONFIGURABLE, on purpose. A refund is what the platform owes when
# the platform takes the seat away: the organizer cancels the event, or
# an Administrator cancels the booking. An attendee who cancels their own
# booking has chosen to give the place up and forfeits what they paid.
#
# This used to be a property. It should not have been - the requirement
# states the rule flatly, and a property meant an environment variable
# could quietly switch it off. The rule now lives in one place, in code:
# see service/RefundPolicy.
# ---------------------------------------------------------------------
