<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Something went wrong')}"></head>
<body>
<div th:replace="~{fragments/navbar :: nav('', true)}"></div>

<main class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <div class="card-custom card-pad text-center" style="padding:var(--s-7) var(--s-6);">

        <!--
          The status code is shown large when there is one, because "404"
          tells a reader more at a glance than a paragraph does. What is
          never shown is the exception, the class name or the stack trace -
          server.error.include-* keep those out of the response, and
          GlobalExceptionHandler logs the detail server-side instead.
        -->
        <div th:if="${status}" class="error-code mb-3" th:text="${status}">500</div>
        <div th:unless="${status}" class="empty-state__icon mb-4"
             style="background:var(--primary-soft);color:var(--primary);">
          <i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i>
        </div>

        <h1 class="mb-3" th:text="${error} ?: 'Something went wrong'">Error</h1>
        <p class="mb-5" style="color:var(--muted);max-width:44ch;margin-inline:auto;"
           th:text="${message} ?: 'The page could not be shown. It may have moved, or you may not have access to it.'">
          Details
        </p>

        <div class="d-flex gap-2 justify-content-center flex-wrap">
          <a th:href="@{/events}" class="btn btn-primary">
            <i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Browse events
          </a>
          <a th:href="@{/}" class="btn btn-light-custom">
            <i class="fa-solid fa-house" aria-hidden="true"></i> Home
          </a>
          <button type="button" class="btn btn-ghost" onclick="history.back()">
            <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Go back
          </button>
        </div>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: foot}"></div>
<script th:src="@{/vendor/bootstrap.bundle.min.js}" defer></script>
</body>
</html>
