# ===================================================================
# EventSphere - test configuration
#
# The point of this file is that `mvn test` must run on a machine that
# has never had MySQL installed, and must not depend on whose
# application.properties happens to be checked out. The unit tests are
# plain JUnit + Mockito and touch no database at all; this file exists so
# that anything which DOES boot a Spring context in future gets an
# isolated, throwaway one rather than reaching for a developer's local
# server.
#
# Nothing here is a real credential. There is deliberately no
# localhost:3306, no personal username, and no shared password.
# ===================================================================

spring.application.name=EventSphere (test)

# In-memory, per-JVM, and gone when the run ends. MySQL compatibility mode
# so that anything written against MySQL syntax still parses.
spring.datasource.url=jdbc:h2:mem:eventsphere-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# The real schema is owned by database/01_schema.sql and is MySQL-specific
# (generated columns, storage engines), so a test context builds its
# tables from the entities instead of trying to replay that file. The
# entity/schema cross-check is done separately - see the README.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# No seeding: a test that needs data creates exactly the rows it needs, so
# a test never passes or fails because of a row somebody else added.
spring.sql.init.mode=never

# Off in tests too - a test must never depend on a reset link being
# echoed back to it.
app.password-reset.dev-mode=false

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
